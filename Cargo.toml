[workspace]
resolver = "2"
members = [
    "ipkt",
    "ipkt-core",
    "ipkt-ntlm",
    "ipkt-smb",
    "ipkt-kerberos",
    "ipkt-dcerpc",
    "ipkt-rpc",
    "ipkt-wmi",
    "ipkt-ldap",
    "ipkt-cli",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
license = "MIT OR Apache-2.0"
authors = ["The ipkt Authors"]
repository = "https://github.com/pathofharmony/ipkt"
homepage = "https://github.com/pathofharmony/ipkt"
documentation = "https://docs.rs/ipkt"
keywords = ["ntlm", "smb", "kerberos", "active-directory", "windows-protocols"]
categories = ["network-programming", "authentication", "cryptography"]
readme = "README.md"

# Shared dependency versions. Each crate opts in via `dep.workspace = true`.
[workspace.dependencies]
# Internal crates
ipkt-core = { version = "0.1.0", path = "ipkt-core" }
ipkt-ntlm = { version = "0.1.0", path = "ipkt-ntlm" }
ipkt-smb = { version = "0.1.0", path = "ipkt-smb" }
ipkt-kerberos = { version = "0.1.0", path = "ipkt-kerberos" }
ipkt-dcerpc = { version = "0.1.0", path = "ipkt-dcerpc" }
ipkt-rpc = { version = "0.1.0", path = "ipkt-rpc" }
ipkt-wmi = { version = "0.1.0", path = "ipkt-wmi" }
ipkt-ldap = { version = "0.1.0", path = "ipkt-ldap" }

# Error handling
thiserror = "2.0"

# Serialization
serde = { version = "1.0", features = ["derive"] }

# Async runtime
tokio = { version = "1.43", default-features = false, features = ["net", "io-util", "rt", "time", "macros"] }
bytes = "1.9"

# CLI
clap = { version = "4.5", features = ["derive"] }

# Bit flags
bitflags = { version = "2.6", features = ["serde"] }

# Cryptography (RustCrypto ecosystem)
md4 = "0.10"
md-5 = "0.10"
hmac = "0.12"
sha2 = "0.10"
sha1 = "0.10"
aes = "0.8"
cbc = { version = "0.1", features = ["alloc"] }
block-padding = "0.3"
aes-gcm = "0.10"
pbkdf2 = { version = "0.12", default-features = false, features = ["hmac"] }
rc4 = "0.1"
des = "0.8"
cipher = "0.4"
rand = "0.8"

# Utilities
hex = "0.4"

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "allow"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
